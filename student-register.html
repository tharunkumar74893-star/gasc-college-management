<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Registration | GASC</title><link rel="stylesheet" href="assets/style.css"></head><body><div id="header"></div><main class="auth-wrap"><form class="auth-card wide" id="registration-form" data-role="student"><span class="eyebrow">GASC PORTAL</span><h1>Student Registration</h1><p class="muted">Students can log in immediately after successful registration.</p><div class="form-grid"><label>Student Photo<input type="file" name="photo" accept="image/*"></label><label>Full Name<input required name="name"></label><label>Date of Birth<input required type="date" name="dob"></label><label>Gender<select required name="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></label><label>Roll Number<input required name="rollNumber"></label><label>University Registration Number<input required name="universityRegNo"></label><label>Degree<select required name="degree"><option value="">Select degree</option><option>B.A.</option><option>B.Sc.</option><option>B.Com.</option></select></label><label>Department<select required name="department"><option>B.A. Tamil</option><option>B.A. English</option><option>B.Sc. Computer Science</option><option>B.Sc. Mathematics</option><option>B.Com. Commerce</option></select></label><label>Current Semester<select required name="semester"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label><label>Academic Year<input required name="academicYear" placeholder="2026-2027"></label><label>Admission Year<input required type="number" name="admissionYear" min="2000" max="2100"></label><label>Mobile Number<input required type="tel" name="mobile"></label><label>Email ID<input required type="email" name="email"></label><label>Father Name<input required name="fatherName"></label><label>Mother Name<input required name="motherName"></label><label>Residential Address<textarea required name="address" rows="2"></textarea></label><label>Physically Challenged<select name="physicallyChallenged"><option>No</option><option>Yes</option></select></label><label>Visually Challenged<select name="visuallyChallenged"><option>No</option><option>Yes</option></select></label><label>Blood Group<input name="bloodGroup" placeholder="e.g. O+"></label><label>Password<input required type="password" name="password" minlength="6"></label><label>Confirm Password<input required type="password" name="confirmPassword" minlength="6"></label></div><button class="btn teal full">Submit Registration</button><p class="form-message" id="reg-msg"></p><p class="register-prompt">Already have an account? <a href="login.html">Login here</a></p></form></main><div id="footer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script src="assets/app.js"></script></body></html>
