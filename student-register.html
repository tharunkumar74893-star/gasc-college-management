<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Registration | GASC</title><link rel="stylesheet" href="assets/style.css"></head><body><div id="header"></div><main class="auth-wrap"><form class="auth-card wide" id="registration-form" data-role="student"><span class="eyebrow">GASC PORTAL</span><h1>Student Registration</h1><p class="muted">Students can log in immediately after successful registration.</p><div class="form-grid"><label>Student Photo<input type="file" name="photo" accept="image/*"></label><label>Full Name<input required name="name"></label><label>Date of Birth<input required type="date" name="dob"></label><label>Gender<select required name="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></label><label>Roll Number<input required name="rollNumber"></label><label>University Registration Number<input required name="universityRegNo"></label><label>Degree<select required name="degree"><option value="">Select degree</option><option>B.A.</option><option>B.Sc.</option><option>B.Com.</option></select></label><label>Department<select required name="department"><option>B.A. Tamil</option><option>B.A. English</option><option>B.Sc. Computer Science</option><option>B.Sc. Mathematics</option><option>B.Com. Commerce</option></select></label><label>Current Semester<select required name="semester"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label><label>Academic Year<input required name="academicYear" placeholder="2026-2027"></label><label>Admission Year<input required type="number" name="admissionYear" min="2000" max="2100"></label><label>Mobile Number<input required type="tel" name="mobile"></label><label>Email ID<input required type="email" name="email"></label><label>Father Name<input required name="fatherName"></label><label>Mother Name<input required name="motherName"></label><label>Residential Address<textarea required name="address" rows="2"></textarea></label><label>Physically Challenged<select name="physicallyChallenged"><option>No</option><option>Yes</option></select></label><label>Visually Challenged<select name="visuallyChallenged"><option>No</option><option>Yes</option></select></label><label>Blood Group<input name="bloodGroup" placeholder="e.g. O+"></label><label>Password<input required type="password" name="password" minlength="6"></label><label>Confirm Password<input required type="password" name="confirmPassword" minlength="6"></label></div>

<!-- Face Attendance Biometric Capture Block (Add-on) -->
<div id="face-capture-panel" style="margin:18px 0;padding:14px;border:1px solid #cbd5e1;border-radius:10px;background:#f8fafc;">
  <h3 style="margin:0 0 6px;font-size:16px;">Face Biometric Registration (For Attendance)</h3>
  <p id="face-enroll-status" class="muted" style="margin:0 0 10px;font-size:13px;">Start camera and capture your face to generate 128D face descriptor.</p>
  <video id="reg-face-video" width="320" height="240" autoplay muted playsinline style="display:none;border-radius:8px;background:#000;margin-bottom:10px;"></video>
  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <button type="button" class="btn" id="btn-start-reg-cam">Start Camera</button>
    <button type="button" class="btn" id="btn-capture-reg-face" disabled>Capture Face</button>
  </div>
</div>

<button class="btn teal full">Submit Registration</button><p class="form-message" id="reg-msg"></p><p class="register-prompt">Already have an account? <a href="login.html">Login here</a></p></form></main><div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script type="module">
  import {
    startCameraStream,
    stopCameraStream,
    enrollStudentFace
  } from './assets/face-attendance.js';

  const supabaseUrl = window.GASC_SUPABASE_URL;
  const supabaseKey = window.GASC_SUPABASE_ANON_KEY;
  const supabase = (window.supabase && window.supabase.createClient && supabaseUrl && supabaseKey)
    ? window.supabase.createClient(supabaseUrl, supabaseKey)
    : (window.supabaseClient || null);

  const form = document.getElementById('registration-form');
  const videoEl = document.getElementById('reg-face-video');
  const statusEl = document.getElementById('face-enroll-status');
  const startCamBtn = document.getElementById('btn-start-reg-cam');
  const captureBtn = document.getElementById('btn-capture-reg-face');

  window.gascCapturedFaceReady = false;

  startCamBtn?.addEventListener('click', async () => {
    try {
      statusEl.textContent = 'Opening camera & loading face models...';
      videoEl.style.display = 'block';
      await startCameraStream(videoEl);
      captureBtn.disabled = false;
      statusEl.textContent = 'Camera active. Keep one face centered and click "Capture Face".';
    } catch (err) {
      statusEl.textContent = err.message;
    }
  });

  captureBtn?.addEventListener('click', async () => {
    try {
      captureBtn.disabled = true;
      if (!supabase) throw new Error('Supabase client not initialized.');

      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        // Save temporary pending flag; once user signs in / registers, save descriptor right after
        sessionStorage.setItem('gasc_pending_face_enroll', '1');
        window.gascCapturedFaceReady = true;
        statusEl.textContent = 'Face captured! Will link to your profile right after registration/login.';
        stopCameraStream(videoEl);
        videoEl.style.display = 'none';
        return;
      }

      const res = await enrollStudentFace({
        supabase,
        videoElement: videoEl,
        profileId: user.id,
        onProgress: (msg) => { statusEl.textContent = msg; }
      });

      window.gascCapturedFaceReady = true;
      statusEl.textContent = res.message;
      stopCameraStream(videoEl);
      videoEl.style.display = 'none';
    } catch (err) {
      statusEl.textContent = err.message;
      captureBtn.disabled = false;
    }
  });

  // After existing app.js handles form submit, if session exists and pending flag is set, complete DB save
  form?.addEventListener('submit', async () => {
    if (!supabase || sessionStorage.getItem('gasc_pending_face_enroll') !== '1') return;

    setTimeout(async () => {
      try {
        const { data: { user } } = await supabase.auth.getUser();
        if (user && videoEl) {
          await startCameraStream(videoEl);
          await enrollStudentFace({
            supabase,
            videoElement: videoEl,
            profileId: user.id,
            onProgress: (msg) => { statusEl.textContent = msg; }
          });
          sessionStorage.removeItem('gasc_pending_face_enroll');
          stopCameraStream(videoEl);
          videoEl.style.display = 'none';
        }
      } catch (_) {
        // Silent fallback if email confirmation is required before session creation
      }
    }, 1500);
  });
</script>
</body></html>
