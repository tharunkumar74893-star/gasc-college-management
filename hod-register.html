<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOD Registration | GASC</title><link rel="stylesheet" href="assets/style.css"></head><body><div id="header"></div><main class="auth-wrap"><form class="auth-card wide" id="registration-form" data-role="hod"><span class="eyebrow">GASC PORTAL</span><h1>HOD Registration</h1><p class="muted">HOD account becomes active only after Admin approval.</p><div class="form-grid"><label>Profile Photo<input type="file" name="photo" accept="image/*"></label><label>Full Name<input required name="name"></label><label>Gender<select required name="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></label><label>Mobile Number<input required type="tel" name="mobile"></label><label>Email ID<input required type="email" name="email"></label><label>Department<select required name="department"><option value="">Select department</option><option>B.A. Tamil</option><option>B.A. English</option><option>B.Sc. Computer Science</option><option>B.Sc. Mathematics</option><option>B.Com. Commerce</option></select></label><label>Password<input required type="password" name="password" minlength="6"></label><label>Confirm Password<input required type="password" name="confirmPassword" minlength="6"></label></div><button class="btn teal full">Submit Registration</button><p class="form-message" id="reg-msg"></p><p class="register-prompt">Already have an account? <a href="login.html">Login here</a></p></form></main><div id="footer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script src="assets/app.js"></script></body></html>
